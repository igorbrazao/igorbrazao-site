name: Atualizar Índices Financeiros

# Roda automaticamente todo dia 15 de cada mês (após o IBGE/BCB divulgarem
# os índices do mês anterior) e também pode ser disparado manualmente
# pela aba Actions do GitHub, em "Run workflow".
on:
  schedule:
    - cron: '0 12 15 * *'   # dia 15, 12h UTC (9h no horário de Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar índices no Banco Central e gravar JSON
        run: node scripts/atualizar-indices.mjs

      - name: Commit e push se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/indices.json
          git diff --staged --quiet && echo "Sem mudanças nos índices." || (
            git commit -m "Atualização automática dos índices financeiros"
            git push
          )
